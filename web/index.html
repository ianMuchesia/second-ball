<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Ball</title>
    <!-- The pre-match screen (components/Kickoff.tsx): styled here so it shows
         before the app's code and stylesheet have loaded. -->
    <style>
      body { margin: 0; background: #121110; }
      .kickoff { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px 16px; box-sizing: border-box; background: radial-gradient(ellipse at 50% 40%, #1f1c18 0%, #121110 70%); color: #ede8df; font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif; }
      .kickoff-brand { display: flex; flex-direction: column; align-items: center; gap: 6px; animation: kickoff-in 0.7s ease-out both; }
      .kickoff-word { font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.2rem); text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
      .kickoff-word::after { content: ""; display: block; height: 5px; width: 64px; margin: 8px auto 0; background: #e08a3c; transform: skewX(-20deg); }
      .kickoff-sub { color: #a39d92; font-size: 0.95rem; letter-spacing: 0.02em; }
      .kickoff-pitch { width: min(360px, 80vw); height: auto; overflow: visible; }
      .kickoff-pitch rect, .kickoff-pitch line, .kickoff-pitch circle:not(.kickoff-ball) { fill: none; stroke: rgba(237, 232, 223, 0.5); stroke-width: 0.8; stroke-dasharray: 1; stroke-dashoffset: 1; animation: kickoff-draw 1.1s ease-out forwards; }
      .kickoff-pitch line { animation-delay: 0.35s; }
      .kickoff-pitch circle:not(.kickoff-ball) { animation-delay: 0.6s; }
      .kickoff-pitch rect + line + circle + rect, .kickoff-pitch rect + line + circle + rect + rect { animation-delay: 0.85s; }
      .kickoff-ball { fill: #e08a3c; animation: kickoff-roll 2.6s ease-in-out 1.2s infinite both; }
      .kickoff-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 240px; font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6f6a62; }
      .kickoff-steps li { display: flex; align-items: center; gap: 10px; }
      .kickoff-steps li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #3a3732; box-sizing: border-box; flex: none; }
      .kickoff-steps li.now { color: #ede8df; }
      .kickoff-steps li.now::before { border-color: #e08a3c; border-right-color: transparent; animation: kickoff-spin 0.8s linear infinite; }
      .kickoff-steps li.done { color: #a39d92; }
      .kickoff-steps li.done::before { content: "✓"; border: none; color: #e08a3c; font-size: 1rem; line-height: 14px; text-align: center; }
      @keyframes kickoff-draw { to { stroke-dashoffset: 0; } }
      @keyframes kickoff-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes kickoff-spin { to { transform: rotate(360deg); } }
      /* Short passes up the pitch, then a shot into the far goal. */
      @keyframes kickoff-roll {
        0% { transform: translate(62px, 42px); opacity: 0; }
        8% { opacity: 1; }
        30% { transform: translate(78px, 26px); }
        55% { transform: translate(96px, 52px); }
        80% { transform: translate(121px, 40px); opacity: 1; }
        100% { transform: translate(121px, 40px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .kickoff *, .kickoff *::before { animation: none !important; stroke-dashoffset: 0 !important; }
        .kickoff-ball { transform: translate(62px, 42px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="kickoff" role="status" aria-live="polite">
        <div class="kickoff-brand">
          <span class="kickoff-word">Second Ball</span>
          <span class="kickoff-sub">AI commentary · a human producer in control</span>
        </div>
        <svg class="kickoff-pitch" viewBox="0 0 124 84" aria-hidden="true">
          <rect x="2" y="2" width="120" height="80" pathLength="1" />
          <line x1="62" y1="2" x2="62" y2="82" pathLength="1" />
          <circle cx="62" cy="42" r="11" pathLength="1" />
          <rect x="2" y="24" width="18" height="36" pathLength="1" />
          <rect x="104" y="24" width="18" height="36" pathLength="1" />
          <circle class="kickoff-ball" cx="0" cy="0" r="2.4" />
        </svg>
        <ol class="kickoff-steps"><li class="now">Opening the stadium</li></ol>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
