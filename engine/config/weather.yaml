# Weather multipliers for the synthetic engine. 1.0 = no effect.
# Every value is TUNABLE (owner: Ian). Placeholder values.
#   ball_speed         pass/shot speed
#   pass_success       chance a pass arrives
#   loose_ball         chance a failed pass becomes a loose ball
#   long_pass_accuracy passes longer than 30 m
#   cross_accuracy     crosses
#   fatigue_rate       how fast legs go (steeper curve late in the game)
