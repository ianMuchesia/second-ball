# Engine mechanics for the synthetic match generator.
# Every value is TUNABLE (owner: Ian). Tuned on 2026-10-21 against real
# 2024/25 reference bands: see docs/DATA_REALISM.md (make realism) and the
# before/after list in DECISIONS.md.

# Pass success = logistic(intercept - distance - pressure - angle - lines broken).
pass_model:
  intercept: 4.75
  per_metre: 0.045           # longer passes fail more
  passer_pressure: 1.8       # pressure load on the passer (0-1)
  receiver_pressure: 2.0     # pressure load on the receiver (0-1)
  forward_angle: 0.5         # straight forward passes are harder than square ones
  per_line_broken: 0.3       # each opponent bypassed by the pass
  cross: 1.4                 # crosses are hard
  restart_bonus: 2.0         # free kicks, throw-ins, kick-offs
  long_from_m: 30.0          # long balls are contested: extra difficulty beyond this
  long_per_metre: 0.08
  per_strength: 4.0          # logit per unit of club strength above 0.5. TUNABLE

# Shot xG = logistic(intercept + distance + angle + body part + assist type).
xg_model:
  intercept: -1.25
  per_metre: -0.11
  per_radian_of_goal: 1.0    # angle the goal mouth makes from the shot spot
  header: -0.8
  assist:
    none: 0.0
    pass: 0.1
    through_ball: 0.4
    cross: 0.0
    set_piece: -0.2

pressing:
  base_probability: 0.30     # chance a defender is close to the carrier
  ppda_reference: 10.0       # press intensity = reference / club target_ppda
  high_press_zone_x: 63.0    # PPDA counts in the carrier's own 60% (x < 63)
  deep_zone_x: 80.0          # near the defenders' goal ...
  deep_zone_press: 5.0       # ... a close defender is this many times more likely. TUNABLE
  close_distance_m: [0.5, 2.0]
  open_distance_m: [2.5, 12.0]
  goal_side_share: 0.6       # how often the closest defender is goal-side
  counterpress_probability: 0.8   # chance of a close defender inside a counterpress window
  counterpress_regain: 0.15       # chance the counterpress wins the ball straight back

# Ian's rule (2026-10-20): at least one opponent within 2 m = under pressure.
under_pressure_m: 2.0

facing_back:
  pressed_in_own_half: 0.35
  otherwise: 0.10

failed_pass:                 # what happens after a pass fails (relative weights)
  interception: 0.27
  tackle: 0.08
  loose_ball: 0.77           # multiplied by the weather's loose_ball
loose_ball_out_of_play: 0.2
loose_ball_kept: 0.5

challenges:
  foul: 0.42                 # per tackle attempt
  yellow_per_foul: 0.17
  red_per_foul: 0.0075
  min_players: 7             # no more red cards below this many players

shots:
  bias: 1.65                 # how readily players shoot, scaled by xG
  min_x: 75.0                # no shots from further out
  save_share: 0.27           # share of missed shots the keeper saves
  corner_after_save: 0.3
  corner_success: 0.32

# Club identity (Phase 1e). TUNABLE, owner: Ian.
style:
  final_third_x: 70.0        # beyond this, every team combines
  final_third_directness: 0.35
  safe_pass_bonus: 4.0       # possession teams (passes_per_possession > 5) recycle short
  direct_shot_bonus: 1.5     # shot willingness x (1 + this x directness)
  pass_weight_before_target: 1.3   # below the club's passes_per_possession ...
  pass_weight_after_target: 1.0    # ... above it
  go_long_directness: 0.95   # past passes_per_possession (outside the final third): go long
  go_long_backward: 0.2      # ... and rarely pass backwards
  direct_counter: 0.6        # after winning the ball: counter into the channel with p = this x directness

clearance_kept: 0.45
cross_share: 0.55            # chance a wide final-third pass is a cross

fatigue_k: 0.3               # press at 90' = 1 - fatigue_k * weather fatigue_rate

# Game state (Ian, 2026-10-21). All TUNABLE, owner: Ian.
# From from_minute: a leader by 1-3 goals "manages"; it escalates to "protect"
# when the opponent's share of the last threat_window_s with the ball in the
# leader's defensive third reaches escalate_share (lower vs a stronger
# opponent), and returns to "manage" only after calm_s below calm_share
# (hysteresis). A side trailing by 1-2 "chases". A lead of 4+ = normal style.
# Mode and threat are engine-internal: never in events, never read by the analyser.
game_state:
  from_minute: 65
  comfortable_margin: 4
  chase_max_deficit: 2
  threat_window_s: 300
  defensive_third_x: 35.0
  escalate_share: 0.35
  escalate_share_vs_stronger: 0.25
  stronger_by: 0.0           # opponent strength > own + this = stronger
  calm_share: 0.20
  calm_s: 300
  min_mode_s: 300            # threat-driven switches at most once per 5 minutes
  manage:                    # lead 1-3: press a step lower, slower, safer
    block_drop_m: 5
    press: 0.55
    tempo: 1.15
    directness: -0.05
  protect:                   # threatened: club's late_lead_block_drop, counters
    press: 0.4
    tempo: 1.2
    directness: 0.25
    counter_probability: 0.4
    clearance: 2.5             # clears its lines more instead of passing out
  chase:                     # trailing 1-2: faster, full-backs higher, more risk
    press: 1.35
    tempo: 0.8
    directness: 0.0
    fullback_push_m: 8
    shot_bias: 1.25

stoppage_minutes: [1, 5]
frame_noise_m: 2.0

shapes:
  left_from_y: 45.33         # ball at y >= this (team's own frame) = ball on the left
  right_until_y: 22.67       # ball at y <= this = ball on the right
  ball_pull: 0.15            # shape slides this share of the ball's offset within a side
  follow: 0.5                # each frame, players move this share towards their anchor
  transition_s: 5            # seconds both teams use the transition shape after a turnover
  attack_runs:               # midfielders join the attack deep in the opponent's half
    from_x: 30.0
    full_x: 90.0
    share: 0.85              # share of the way to the front line at full_x. TUNABLE
    forwards_wanted: 5       # shapes with this many forwards push nobody up; 2 forwards = full share
