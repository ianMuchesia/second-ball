    left:
      LCB: [0.0, 46]
      RCB: [0.0, 34]
      RB:  [0.0, 22]     # far-side FB stays deep as the third CB
      DM:  [0.4, 37]     # base two = DM + the other CM
      LCM: [0.4, 47]
