[project]
name = "second-ball"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.31.0",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["web"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
