    casual: "PLACEHOLDER (Ian): short, a little emotion, plain words."
    analyst: "PLACEHOLDER (Ian): precise, with the number and the why."
  - moment: red_card_63
    casual: "PLACEHOLDER (Ian)"
    analyst: "PLACEHOLDER (Ian)"
  - moment: counter_goal_88
    casual: "PLACEHOLDER (Ian)"
    analyst: "PLACEHOLDER (Ian)"
