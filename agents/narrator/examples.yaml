# Narrator few-shot examples: Ian's lines (second version), at most 25 words.
# One casual-fan line and one analyst line per moment. Numbers in a line must
# come from that moment's values: tests/unit/test_narrator_examples.py runs
# every line through the Verifier against the real demo moment. These are the
# first gold eval items.
#
# Moments (demo, Riverside 0-2 Harbour):
#   34': Harbour's counter behind Riverside's left-back, 0-1
#   63': Riverside's red card (last man, left centre-back)
#   88': Harbour's 2nd counter goal behind the left-back, 0-2

examples:
  - moment: counter_goal_34
    kind: goal
    minute: 34
    casual: "Lightning from Harbour! One pass behind Riverside's left-back on the counter, and Harbour lead 1-0!"
    analyst: "Harbour counter into the space behind Riverside's left-back, pushing their xG from 0.16 to 0.61 with that single chance."
  - moment: red_card_63
    kind: red_card_impact
    minute: 63
    casual: "Red card for Riverside! Their last man walks while trailing 0-1, leaving them down to ten men!"
    analyst: "Riverside lose their left centre-back; Harbour halve ball pressure from 0.52 to 0.25, raising Riverside's control to 0.80 and defence-midfield gap to 13.8 m."
  - moment: counter_goal_88
    kind: goal
    minute: 88
    casual: "Harbour strike on the break again! Right behind Riverside's left-back once more to make it 0-2!"
    analyst: "Another sharp counter behind Riverside's left-back lifts Harbour's xG from 1.28 to 1.73 as that open channel is punished again."
